<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#d4162c">
    <title>Donapola · Pedidos</title>

    <!-- Favicons e Íconos PWA -->
    <link rel="icon" type="image/png" href="./icons/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg">
    <link rel="shortcut icon" href="./icons/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
    <link rel="manifest" href="./manifest.json">

    <!-- Compatibilidad con iOS / Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Donapola">

    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Rammetto+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">

    <!-- Hoja de estilos -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-layout">
        <!-- Navegación lateral en escritorio / inferior en móviles -->
        <nav id="nav"></nav>

        <div class="main-content">
            <header>
                <h1>Donapola</h1>
                <p id="subtitulo">Pedidos</p>
            </header>

            <!-- Contenedor principal donde se inyectan las vistas -->
            <main id="vista-principal"></main>
        </div>
    </div>

    <!-- Botón flotante para nuevo pedido -->
    <button id="fab" aria-label="Nuevo pedido">+</button>

    <!-- Modal (Fondo oscuro y panel) -->
    <div id="modal-fondo">
        <div class="panel-modal" id="panel-formulario"></div>
    </div>

    <!-- Script de la aplicación -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
